name: CI Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches:
      - "**"

# Never let two production deploys overlap, and never cancel one midway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: daih_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5433/daih_db?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-super-secret-jwt-key-min-32-chars-long"
      JWT_REFRESH_SECRET: "ci-super-secret-refresh-key-min-32-chars-long"
      TOKEN_ENCRYPTION_KEY: "ci-super-secret-encryption-key-min-32-chars"
      QR_SIGNING_SECRET: "ci-qr-signing-key-1234567890"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @daih/api prisma:generate

      - name: Deploy Database Migrations
        run: pnpm --filter @daih/api run prisma:migrate:deploy

      - name: Seed Email Templates
        run: pnpm --filter @daih/api run seed:templates

      - name: Check Code Formatting
        run: pnpm lint

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build Monorepo
        run: pnpm build

  deploy:
    name: Deploy to Production VPS
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # Attach required reviewers to this environment in
    # Settings -> Environments -> production to gate deploys on approval.
    environment:
      name: production
      url: https://daih.ng

    steps:
      - name: Open SSH session
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key so a hijacked DNS record cannot receive our key.
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/var/www/daih' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
              -o BatchMode=yes -o ServerAliveInterval=30 \
              "$SSH_USER@$SSH_HOST" \
              "APP_DIR='$APP_DIR' bash '$APP_DIR/scripts/deploy.sh' '${{ github.sha }}'"

      - name: Revoke key material
        if: always()
        run: rm -f ~/.ssh/id_deploy
